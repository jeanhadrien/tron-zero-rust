# Build and push the game server image.
#   gcloud builds submit --config cloudbuild.server.yaml --substitutions=_TAG=v1 .
substitutions:
  _TAG: latest
  _IMAGE: europe-west1-docker.pkg.dev/tron-zero-js/tron/tron-zero-server
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.server
      - -t
      - ${_IMAGE}:${_TAG}
      - .
images:
  - ${_IMAGE}:${_TAG}
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
