[workspace]
members = ["crates/shared", "crates/server", "crates/client", "crates/lab"]
resolver = "2"

[workspace.dependencies]
bevy = "0.19"
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_reflect = "0.19"
lightyear = "0.28"
bevy_egui = "0.41"
bevy_kira_audio = "0.26"
glam = "0.32"
serde = { version = "1", features = ["derive"] }
postcard = "1.1"
tracing = "0.1"
rand = "0.10"

# Dev builds: light optimisation for our crates keeps incremental rebuilds
# fast; dependencies (Bevy, Lightyear) are built once at full optimisation so
# the game, server, lab and tests run at a realistic speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
