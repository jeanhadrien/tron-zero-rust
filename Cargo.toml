[workspace]
members = ["crates/shared", "crates/bots", "crates/server", "crates/client", "crates/lab", "crates/nettest"]
resolver = "2"

# Code style checked by `cargo clippy --workspace --all-targets -- -D warnings`
# (tests are exempt from the unwrap/expect lints, see clippy.toml).
[workspace.lints.clippy]
# Bevy system params (nested Query filters, many params) always trip these.
type_complexity = "allow"
too_many_arguments = "allow"
# Systems early-return with `let ... else`; fail-fast exceptions opt out locally.
unwrap_used = "deny"
expect_used = "deny"
# `tracing` only, so a binary's log subscriber sees everything.
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
# No default features: every crate opts in to what it uses (the default set pulls
# in 3D, PBR, UI, audio, gamepad... which the game never touches).
bevy = { version = "0.19", default-features = false }
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_reflect = "0.19"
lightyear = "0.28"
# Only for `TransportSystems`, which the lightyear facade does not re-export.
lightyear_transport = "0.28"
bevy_egui = { version = "0.41", default-features = false }
glam = "0.32"
serde = { version = "1", features = ["derive"] }
postcard = "1.1"
tracing = "0.1"
rand = "0.10"

# Dev builds: light optimisation for our crates keeps incremental rebuilds
# fast; dependencies (Bevy, Lightyear) are built once at full optimisation so
# the game, server, lab and tests run at a realistic speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser build (`web/build.ps1`): speed over size, single codegen unit for
# the best inlining. Not for native builds.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Vendored dependency patches (see vendor/README.md).
[patch.crates-io]
lightyear_transport = { path = "vendor/lightyear_transport" }
xwt-web = { path = "vendor/xwt-web" }
