[package]
name = "tron-zero-lab"
version = "0.0.0"
edition = "2024"
publish = false
description = "Headless, deterministic scenario runner for the shared sim (traces + PNG)."

[dependencies]
shared = { path = "../shared", package = "tron-zero-shared" }
bots = { path = "../bots", package = "tron-zero-bots" }
bevy_ecs.workspace = true
glam.workspace = true
serde.workspace = true
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.9"
tiny-skia = "0.11"
rayon = "1"

[lints]
workspace = true
