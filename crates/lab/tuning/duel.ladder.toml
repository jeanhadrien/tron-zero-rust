# The server's difficulty ladder: five rungs from one strong build, measured in
# 1v1 rounds by round robin, then every
# pair of rungs plays head to head. Small on purpose (a few minutes on 4
# threads). Regenerate the committed roster with:
#
#   cargo run --release -p tron-zero-lab -- ladder crates/lab/tuning/duel.ladder.toml --threads 4 --out ladder.toml
#
# and copy the five rungs into `crates/bots/rosters/default.toml` (see there).
seeds = 4               # round-robin duels: seeds 1..=4 (both seats, 4 rounds each)
check_seeds = 6         # head-to-heads: seeds 100000..=100005
rungs = 5
candidates = 11         # degradation steps measured (>= rungs)
strength = "duels"      # round robin of the candidates, head to head
name = "Cadet"
degrade_to = 500        # authoring preset whose budget is the weakest end
roster = "builtin"      # the pool; "duels" does not play it

[degrade]              # past the presets: a bot that blunders often
reaction_ticks = 36
horizon_ticks = 8
noise = 0.95

[base]
name = "Ace"
bot = "trapper"
difficulty = 4000

[[setup]]
name = "duel"
riders = 2

[setup.match]
respawn = "never"
rounds = 4

[setup.match.end]
last_standing = true
time_limit = 3600
