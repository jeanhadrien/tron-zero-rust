# A local server listed on the Cloud Run lobby (`scripts/dev-cloud.bat`).
# Same rules as the official server; keys: see `src/config.rs`.

[server]
name = "JH dev"
max_players = 10

[match]
rounds = 1
intermission_secs = 3
end_screen_secs = 8

[round]
secs = 600
respawn = "anytime"
last_standing = false

[bots]
roster = "builtin"
