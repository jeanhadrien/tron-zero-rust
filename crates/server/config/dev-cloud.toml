# A local server listed on the Cloud Run lobby (`scripts/dev-cloud.bat`).
# Same rules as the official server; keys: see `src/config.rs`.

[server]
name = "JH dev"
max_players = 10

[match]
rounds = 5
intermission_secs = 3
end_screen_secs = 8

[round]
secs = 90
respawn = "next_round"
last_standing = true

[bots]
roster = "builtin"
