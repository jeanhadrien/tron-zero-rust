# Official server config: what the official servers run (embedded in the
# server at build time; SERVER_CONFIG=path loads another file instead). Game
# settings only: ports, advertised host, manager and secrets are env vars
# (docs/guides/building.md). Keys: see `src/config.rs`.
#
# Five last-standing rounds of at most 90 seconds: a crashed rider waits for
# the next round; the scores reset with each new match.

[server]
name = "Tron Zero EU"
max_players = 10

[match]
rounds = 5
intermission_secs = 3
end_screen_secs = 8

[round]
secs = 90
respawn = "next_round"
last_standing = true

[bots]
roster = "builtin"
