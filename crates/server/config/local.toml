# Local play (`scripts/play-local.*`): five last-standing rounds with the
# built-in bots. Copy this file to try other settings; keys: see `src/config.rs`.

[server]
name = "Local"
max_players = 10

[match]
rounds = 5
intermission_secs = 3
end_screen_secs = 8

[round]
secs = 90
respawn = "next_round"
last_standing = true

[bots]
roster = "builtin"
