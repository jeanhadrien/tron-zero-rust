[package]
name = "tron-zero-server"
version = "2.0.0"
edition = "2024"

[dependencies]
shared = { path = "../shared", package = "tron-zero-shared" }
bots = { path = "../bots", package = "tron-zero-bots" }
bevy = { workspace = true, features = ["bevy_log", "bevy_state"] }
# Direct dep only to refresh a late-admitted link's `ClientVisibility` (`admission.rs`); version matches lightyear_replication.
bevy_replicon = "0.41"
lightyear = { workspace = true, features = ["udp", "raw_connection", "input_native", "webtransport"] }
# Direct deps only for the WebTransport listener (`web.rs`); versions match lightyear_webtransport.
aeronet_io = "0.21"
aeronet_webtransport = { version = "0.21", features = ["server"] }
lightyear_aeronet = "0.28"
# Direct dep only to order the probe hook before the transport parses packets (`probe.rs`).
lightyear_transport.workspace = true
time = "0.3"
tokio = { version = "1", features = ["rt"] }
rand.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json = "1"
# Server config file (`config.rs`); version matches the bots crate.
toml = "0.9"
ureq = { version = "3", features = ["json"] }
# Ranked mode (`ranked.rs`): join tickets are Ed25519-signed by the manager, carried as base64 in heartbeats.
ed25519-dalek = "2"
base64 = "0.22"
ctrlc = { version = "3", features = ["termination"] }

[lints]
workspace = true
