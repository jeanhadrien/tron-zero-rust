[package]
name = "tron-zero-server"
version = "0.2.0"
edition = "2024"

[dependencies]
shared = { path = "../shared", package = "tron-zero-shared" }
bots = { path = "../bots", package = "tron-zero-bots" }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state"] }
lightyear = { workspace = true, features = ["udp", "raw_connection", "input_native"] }
rand.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json = "1"
ureq = { version = "3", features = ["json"] }
ctrlc = { version = "3", features = ["termination"] }
