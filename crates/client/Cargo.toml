[package]
name = "tron-zero-client"
version = "0.2.0"
edition = "2024"

[dependencies]
shared = { path = "../shared", package = "tron-zero-shared" }
bevy = { workspace = true, features = ["serialize"] }
lightyear = { workspace = true, features = ["raw_connection", "input_native"] }
# Only for `TransportSystems` (ordering the simulated uplink delay); same version as lightyear.
lightyear_transport = "0.28"
bevy_egui.workspace = true
ehttp = "0.7"
rand.workspace = true
serde.workspace = true
serde_json = "1"

# Native: raw UDP and a config file in the platform config dir.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
lightyear = { workspace = true, features = ["udp"] }
dirs = "6"

# Web: WebTransport instead of UDP, WebGL2 rendering, localStorage preferences.
[target.'cfg(target_family = "wasm")'.dependencies]
lightyear = { workspace = true, features = ["webtransport"] }
bevy = { workspace = true, features = ["web", "webgl2"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "UrlSearchParams"] }
# Pulled in transitively (rand, ...); the wasm_js backend is selected by
# `--cfg getrandom_backend="wasm_js"` in .cargo/config.toml.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
