[package]
name = "tron-zero-client"
version = "0.12.0"
edition = "2024"

[dependencies]
shared = { path = "../shared", package = "tron-zero-shared" }
# 2D rendering only (Camera2d, gizmos, Text2d); bevy_egui draws the UI. Spelled
# out instead of the "2d" / "default_app" bundles to leave out what they add:
# bevy_animation, hdr, png, post-processing, picking, scenes and
# reflect_auto_register (which keeps every reflected type's code alive).
bevy = { workspace = true, features = [
    "std",
    "serialize", # KeyCode in saved key bindings
    "async_executor",
    "bevy_log",
    "bevy_state",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "bevy_sprite",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite_render",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "default_font",
] }
lightyear = { workspace = true, features = ["raw_connection", "input_native"] }
# Only for `TransportSystems` (ordering the simulated uplink delay); same version as lightyear.
lightyear_transport = "0.28"
bevy_egui = { workspace = true, features = ["render", "default_fonts", "manage_clipboard"] }
ehttp = "0.7"
# Join tickets arrive base64-encoded from the manager.
base64 = "0.22"
rand.workspace = true
serde.workspace = true
serde_json = "1"

# Native: raw UDP and a config file in the platform config dir.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
lightyear = { workspace = true, features = ["udp"] }
bevy = { workspace = true, features = ["multi_threaded", "x11", "wayland"] }
dirs = "6"

# Web: WebTransport instead of UDP, WebGL2 rendering, localStorage preferences.
[target.'cfg(target_family = "wasm")'.dependencies]
lightyear = { workspace = true, features = ["webtransport"] }
bevy = { workspace = true, features = ["web", "webgl2"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "UrlSearchParams"] }
# Pulled in transitively (rand, ...); the wasm_js backend is selected by
# `--cfg getrandom_backend="wasm_js"` in .cargo/config.toml.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
