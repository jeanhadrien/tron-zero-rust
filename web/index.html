<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tron Zero</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #bevy { display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center;
               color: #7fdcff; font: 16px/1.4 system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="bevy" tabindex="0"></canvas></div>
  <div id="loading">Loading Tron Zero…</div>
  <script type="module">
    import init from "./tron-zero-client.js";

    const loading = document.getElementById("loading");
    try {
      await init();
    } catch (err) {
      // winit unwinds `main` with this exception on purpose to hand control to
      // the browser event loop; anything else is a real failure.
      if (!String(err).includes("Using exceptions for control flow")) {
        loading.textContent = "Failed to start: " + err;
        loading.style.pointerEvents = "auto";
        throw err;
      }
    }
    loading.remove();
    document.getElementById("bevy").focus();
  </script>
</body>
</html>
