# Windows dev builds: rust-lld (shipped with the toolchain) links much faster
# than MSVC link.exe, which dominates incremental rebuild time. Other targets
# (the Linux server build) are unaffected.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Browser build: WebTransport (web-sys) needs the unstable web APIs, and
# getrandom selects its JS backend by cfg. The wasm-bindgen-based entry point
# is produced by web/build.ps1.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis", "--cfg", "getrandom_backend=\"wasm_js\""]
