name: deploy

# Called by release-please.yml when a release is created. GITHUB_TOKEN-created
# releases do NOT fire `release: published`, hence the workflow_call path
# (same reason as the JS repo's deploy-release.yml).
on:
  workflow_call:
  # Manual rebuild / attach to an existing Release (e.g. v0.2.0, whose
  # automatic run used the old placeholder workflow).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-windows:
    name: Build Windows client and attach to Release
    runs-on: windows-latest
    env:
      TRONZERO_MANAGER_URL: ${{ vars.MANAGER_URL != '' && vars.MANAGER_URL || 'https://server-manager.tronzero.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve client release tag
        id: tag
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = (git tag --list 'client-v*' --sort=-v:refname | Select-Object -First 1)
          if (-not $tag) { throw "No client-v* tag found" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          git checkout $tag

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release client
        run: cargo build --release -p tron-zero-client --locked

      - name: Package and upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $zip = "tron-zero-$TAG-windows-x86_64.zip"
          Compress-Archive -Path target/release/tron-zero-client.exe -DestinationPath $zip
          gh release upload "$TAG" "$zip" --clobber

  # The game server rides the same release as the client: a protocol change
  # (PROTOCOL_ID) must reach both together. Auth is keyless (Workload Identity);
  # one-time IAM setup is deploy/gce/grant-ci.sh. Rolling out stops and starts
  # the VM, which drops live games and changes its ephemeral IP (the server
  # re-registers by itself).
  server:
    name: Build the game server image and roll it out to GCE
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    env:
      PROJECT: tron-zero-js
      ZONE: europe-west1-b
      VM: tron-zero-eu
      MANAGER_URL: ${{ vars.MANAGER_URL != '' && vars.MANAGER_URL || 'https://server-manager.tronzero.dev' }}
      IMAGE_REPO: europe-west1-docker.pkg.dev/tron-zero-js/tron/tron-zero-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: ref
        run: |
          git fetch --tags --force
          tag="$(git tag --list 'client-v*' --sort=-v:refname | head -n1)"
          if [ -z "$tag" ]; then echo "No client-v* tag found" >&2; exit 1; fi
          git checkout "$tag"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/335435262909/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deploy@tron-zero-js.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The unit pulls whatever `tron-image` says at every start.
      - name: Point the VM at the new image and restart it
        run: |
          gcloud compute instances add-metadata "$VM" --zone "$ZONE" --project "$PROJECT" \
            --metadata "tron-image=$IMAGE_REPO:${{ steps.ref.outputs.sha }}"
          gcloud compute instances stop "$VM" --zone "$ZONE" --project "$PROJECT"
          gcloud compute instances start "$VM" --zone "$ZONE" --project "$PROJECT"

      # The room must come back as an official ranked one on the VM's new IP.
      - name: Wait for the server to register as official
        run: |
          ip="$(gcloud compute instances describe "$VM" --zone "$ZONE" --project "$PROJECT" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"
          for _ in $(seq 1 60); do
            if curl -fsS "$MANAGER_URL/api/rooms" | jq -e --arg ip "$ip" \
              'any(.[]; .host == $ip and .ranked == true and .official == true)' >/dev/null; then
              echo "Registered as official at $ip"
              exit 0
            fi
            sleep 5
          done
          echo "The server did not register as an official ranked room at $ip within 5 minutes" >&2
          exit 1

  client-web:
    name: Build web client and deploy to GitHub Pages (play.tronzero.dev)
    runs-on: ubuntu-latest
    # Fat-LTO wasm build is slow (tens of minutes); cap it so a hung runner
    # cannot hold the `pages` concurrency group for GitHub's 6 h default.
    timeout-minutes: 90
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://play.tronzero.dev
    env:
      TRONZERO_MANAGER_URL: ${{ vars.MANAGER_URL != '' && vars.MANAGER_URL || 'https://server-manager.tronzero.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve client release tag
        run: |
          git fetch --tags --force
          tag="$(git tag --list 'client-v*' --sort=-v:refname | head -n1)"
          if [ -z "$tag" ]; then echo "No client-v* tag found" >&2; exit 1; fi
          git checkout "$tag"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      # The CLI must match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Resolve wasm-bindgen version
        id: bindgen
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      - name: Build web client
        # Through bash: the checked-out tag may predate build.sh being executable.
        run: bash web/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
